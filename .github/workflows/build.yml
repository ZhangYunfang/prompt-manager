name: build

# 打标签（v*）自动构建四平台产物并挂到对应 Release；
# 也能在 Actions 页面手动 Run workflow，只构建（产物在 run 里下载）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 挂 Release 资产需要

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：GitHub 免费 macOS runner 排队很久甚至不分配，失败不算整体失败，
          # 产物缺失时由维护者本机构建后手动上传（见 Release 说明）。
          - { os: macos-15,        label: macOS arm64, arch: arm64, kind: mac,  optional: true }
          - { os: windows-latest,  label: Windows x64, arch: x64,   kind: win }
          - { os: ubuntu-22.04,    label: Linux x64,   arch: x64,   kind: linux }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Linux 上 PyInstaller 收集 Qt 依赖要这些系统库
      - name: 安装 Linux 依赖
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: 安装 Python 依赖
        working-directory: prompt-manager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 构建
        working-directory: prompt-manager
        run: python -m PyInstaller --noconfirm build.spec

      - name: 打包（macOS）
        if: matrix.kind == 'mac'
        working-directory: prompt-manager
        shell: bash
        run: |
          V=$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo dev)
          ditto -c -k --sequesterRsrc --keepParent dist/PromptManager.app \
            "PromptManager-${V}-macos-${{ matrix.arch }}.zip"

      - name: 打包（Windows）
        if: matrix.kind == 'win'
        working-directory: prompt-manager
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { 'dev' }
          Compress-Archive -Path dist\PromptManager.exe -DestinationPath "PromptManager-$v-windows-${{ matrix.arch }}.zip"

      - name: 打包（Linux）
        if: matrix.kind == 'linux'
        working-directory: prompt-manager
        shell: bash
        run: |
          V=$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo dev)
          tar -czf "PromptManager-${V}-linux-${{ matrix.arch }}.tar.gz" -C dist PromptManager

      - name: 产物清单
        working-directory: prompt-manager
        shell: bash
        run: ls -lh PromptManager-*.*

      - uses: actions/upload-artifact@v4
        with:
          name: PromptManager-${{ matrix.kind }}-${{ matrix.arch }}
          path: prompt-manager/PromptManager-*

      # 只在打标签时挂 Release；手动运行只留 artifact
      - name: 挂到 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: prompt-manager/PromptManager-*
